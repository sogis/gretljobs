import ch.so.agi.gretl.tasks.*
import ch.so.agi.gretl.api.TransferSet

apply plugin: 'ch.so.agi.gretl'

defaultTasks 'updateTxtValues'

def csvFile = file("${buildDir}/in/uploadFile.csv")

tasks.register('deleteData', SqlExecutor) {
    description = 'Bisherige Daten löschen'
    database = [dbUriEdit, dbUserEdit, dbPwdEdit]
    sqlFiles = files("delete_csv.sql")
}

tasks.register('csvImport',  CsvImport) {
    description = 'Importiere CSV-Datei mit Grundstückdaten'
    dependsOn "deleteData"
    database = [dbUriEdit, dbUserEdit, dbPwdEdit]
    schemaName = "hba_immobilienportfolio_v2"
    tableName = "grundstuecke_csv_import"
    firstLineIsHeader = true
    valueSeparator = ';'
    dataFile = csvFile
}

tasks.register("checkImportdata", SqlExecutor) {
    description = 'Umverteilung der Importdaten zur Prüfung derer Vollständigkeit'
    dependsOn "csvImport"
    database = [dbUriEdit, dbUserEdit, dbPwdEdit]
    sqlFiles = files(
        'hba_immobilienportfolio_grundstuecke_mandatory_check.sql',
    )
}

tasks.register('transferData', Db2Db) {
    dependsOn "checkImportdata"
    sourceDb = [dbUriEdit, dbUserEdit, dbPwdEdit]
    targetDb = [dbUriPub, dbUserPub, dbPwdPub]
    transferSets = [
        new TransferSet('hba_immobilienportfolio_grundstuecke_optional_pub.sql', 'hba_immobilienportfolio_pub_v2.immobilienprtflio_grundstuecke', true),
        new TransferSet('hba_immobilienportfolio_grundstuecke_mandatory_pub.sql', 'hba_immobilienportfolio_pub_v2.immobilienprtflio_grundstuecke', false),
        new TransferSet('hba_immobilienportfolio_baurecht_pub.sql', 'hba_immobilienportfolio_pub_v2.immobilienprtflio_baurecht', true)
    ];
}

tasks.register("updateTxtValues", SqlExecutor) {
    description = 'Update der Text-Werte'
    dependsOn "transferData"
    database = [dbUriPub, dbUserPub, dbPwdPub]
    sqlFiles = files(
        'hba_immobilienportfolio_grundstuecke_update.sql'
    )
}