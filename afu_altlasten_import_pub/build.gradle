import de.undercouch.gradle.tasks.download.Download

apply plugin: 'de.undercouch.download'
//apply plugin: 'ch.so.agi.gretl'

def almaUser = "fuu"
def almaPass = "bar"

defaultTasks 'downloadKbsRestrictedData'

task downloadKbsData(type: Download) {
    src 'https://so.alma-os.ch/interlis_exports/so/data.zip'
    dest "$buildDir/open/data.zip"
    username almaUser
    password almaPass
    overwrite true
    acceptAnyCertificate true
}

task downloadKbsRestrictedData(type: Download, dependsOn: 'downloadKbsData') {
    src 'https://so.alma-os.ch/interlis_exports/so_restricted/data.zip'
    dest "$buildDir/restricted/data.zip"
    username almaUser
    password almaPass
    overwrite true
    acceptAnyCertificate true
}

