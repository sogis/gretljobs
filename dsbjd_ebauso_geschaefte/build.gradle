import java.nio.file.Files
import java.net.URI
import java.net.http.HttpClient
import java.net.http.HttpRequest
import java.net.http.HttpResponse
import java.text.SimpleDateFormat
import java.util.TimeZone

import ch.so.agi.gretl.tasks.*
import ch.so.agi.gretl.tasks.Curl.MethodType
import ch.so.agi.gretl.api.*

import groovy.json.JsonSlurper

apply plugin: 'ch.so.agi.gretl'

defaultTasks 'transferToPub'

//def ebauHost = ebausoServiceUrl
def ebauHost = 'https://ebau-t.so.sycloud.ch'
def tokenUrl = "${ebauHost}/auth/realms/ebau/protocol/openid-connect/token"
def exportUrl = "${ebauHost}/api/v1/gis-export/so?full_export=false"

def clientId = ebausoClientId
def clientSecret = ebausoClientSecret

def token = ''
def hasNewData = false

// UTC-Timestamp einmal pro Build bestimmen.
def timestampFormat = new SimpleDateFormat('yyyyMMdd_HHmmss_SSS')
timestampFormat.setTimeZone(TimeZone.getTimeZone('UTC'))
def timestamp = timestampFormat.format(new Date())

def xtfFile = file(
    "$buildDir/so_gis_export_${timestamp}_${gretlEnvironment}.xtf"
)

tasks.register('removeBuildDir', Delete) {
    description = 'Löscht das Build-Verzeichnis mit allen Inhalten'
    delete "$buildDir"
}

tasks.register('getToken', Curl) {
    description = 'Bezieht ein OIDC Access Token vom eBauSO-Keycloak'
    //dependsOn 'removeBuildDir'

    serverUrl tokenUrl
    method MethodType.POST
    outputFile file("$buildDir/token.json")
    expectedStatusCode 200

    data "grant_type=client_credentials" +
         "&scope=openid" +
         "&client_id=$clientId" +
         "&client_secret=$clientSecret"

    headers = [
        'Content-Type': 'application/x-www-form-urlencoded'
    ]

    doLast {
        def slurper = new JsonSlurper()
        def response = slurper.parseText(outputFile.text)

        if (response.access_token != null) {
            token = response.access_token
        }

        if (token.length() == 0) {
            throw new GradleException('Failed to retrieve access token')
        }

        logger.info("Length of access token is: ${token.length()}")
    }
}

// Der Curl-Task unterstützt nur einen expectedStatusCode.
// Hier sind sowohl HTTP 200 als auch HTTP 204 gültige Antworten.
tasks.register('downloadXtf') {
    description = 'Lädt den GIS-Export von eBauSO herunter'
    dependsOn 'getToken'

    doLast {
        def request = HttpRequest.newBuilder()
            .uri(URI.create(exportUrl))
            .header('Authorization', "Bearer $token")
            .GET()
            .build()

        def client = HttpClient.newHttpClient()
        def response = client.send(
            request,
            HttpResponse.BodyHandlers.ofByteArray()
        )

        def sanitizeDiagnostic = { String value ->
            def sanitized = value ?: ''

            if (token) {
                sanitized = sanitized.replace(token, '[REDACTED]')
            }

            if (clientSecret) {
                sanitized = sanitized.replace(clientSecret, '[REDACTED]')
            }

            sanitized = sanitized.replaceAll(/\s+/, ' ').trim()

            if (sanitized.length() > 2000) {
                sanitized = sanitized.substring(0, 2000) + ' … [gekürzt]'
            }

            sanitized
        }

        def logExportError = {
            logger.error("GIS-Export-Antwort: HTTP ${response.statusCode()}")

            def contentType = response.headers()
                .firstValue('Content-Type').orElse('')

            if (contentType) {
                logger.error("Content-Type: ${sanitizeDiagnostic(contentType)}")
            }

            def authenticate = response.headers()
                .firstValue('WWW-Authenticate').orElse('')

            if (authenticate) {
                logger.error(
                    "WWW-Authenticate: ${sanitizeDiagnostic(authenticate)}"
                )
            }

            def requestId = response.headers()
                .firstValue('X-Request-ID').orElse('')

            if (!requestId) {
                requestId = response.headers()
                    .firstValue('X-Correlation-ID').orElse('')
            }

            if (requestId) {
                logger.error("Request-ID: ${sanitizeDiagnostic(requestId)}")
            }

            def responseText = new String(
                response.body(),
                java.nio.charset.StandardCharsets.UTF_8
            )
            responseText = sanitizeDiagnostic(responseText)

            if (responseText) {
                logger.error("GIS-Export-Antworttext: ${responseText}")
            }
        }

        switch (response.statusCode()) {
            case 200:
                Files.createDirectories(xtfFile.toPath().parent)
                Files.write(xtfFile.toPath(), response.body())
                hasNewData = true
                logger.lifecycle("GIS-Export heruntergeladen: $xtfFile")
                break

            case 204:
                hasNewData = false
                Files.deleteIfExists(xtfFile.toPath())
                logger.lifecycle(
                    'Keine Änderungen seit dem letzten Export. ' +
                    'Die nachfolgenden Tasks werden übersprungen.'
                )
                break

            case 401:
            case 403:
                logExportError()
                throw new GradleException(
                    "GIS-Export nicht autorisiert (HTTP ${response.statusCode()})."
                )

            case 404:
                logExportError()
                throw new GradleException(
                    'GIS-Export ist auf diesem System nicht aktiviert (HTTP 404).'
                )

            default:
                logExportError()
                throw new GradleException(
                    "GIS-Export fehlgeschlagen (HTTP ${response.statusCode()})."
                )
        }
    }
}

tasks.register('uploadXtfToS3', S3Upload) {
    description = 'Lädt den originalen eBauSO GIS-Export nach S3 hoch.'
    dependsOn 'downloadXtf'
    onlyIf { hasNewData }

    accessKey = awsAccessKeyAgi
    secretKey = awsSecretAccessKeyAgi
    sourceFile = xtfFile
    endPoint = 'https://s3.eu-central-1.amazonaws.com'
    region = 'eu-central-1'
    bucketName = 'ch.so.dsbjd.ebauso-geschaefte'
    acl = 'private'
}

tasks.register('validateXtf', IliValidator) {
    description = 'Validiert den heruntergeladenen eBauSO GIS-Export'
    dependsOn 'uploadXtfToS3'
    onlyIf { hasNewData }

    dataFiles = files(xtfFile)

    if (findProperty('ilivalidatorModeldir')) {
        modeldir = ilivalidatorModeldir
    }
}

tasks.register('importData', Ili2pgImport) {
    description = 'Ersetzt die Fachdaten im Import-Schema mit dem aktuellen eBauSO GIS-Delta'
    dependsOn 'validateXtf'
    onlyIf { hasNewData }

    database = [dbUriEdit, dbUserEdit, dbPwdEdit]
    dbschema = 'dsbjd_ebauso_geschaefte_import_v1'
    models = 'SO_DSBJD_eBauSO_Geschaefte_20250422'
    dataFile = files(xtfFile)
    disableValidation = true
    deleteData = true
}

tasks.register('transferToWork', SqlExecutor) {
    description = 'Übernimmt das aktuelle eBauSO-Delta in den kumulativen Datenbestand (UPSERT)'
    dependsOn 'importData'
    onlyIf { hasNewData }

    database = [dbUriEdit, dbUserEdit, dbPwdEdit]
    sqlFiles = files('transfer_to_work.sql')
}

tasks.register('transferToPub', Db2Db) {
    dependsOn 'transferToWork'
    onlyIf { hasNewData }

    sourceDb = [dbUriEdit, dbUserEdit, dbPwdEdit]
    targetDb = [dbUriPub, dbUserPub, dbPwdPub]
    transferSets = [
        new TransferSet(
            'transfer_to_pub_punkt.sql',
            'afu_ebauso_geschaefte_pub_v1.geschaefte_geschaeft_punkt',
            true
        ),
        new TransferSet(
            'transfer_to_pub_linie.sql',
            'afu_ebauso_geschaefte_pub_v1.geschaefte_geschaeft_linie',
            true
        ),
        new TransferSet(
            'transfer_to_pub_flaeche.sql',
            'afu_ebauso_geschaefte_pub_v1.geschaefte_geschaeft_flaeche',
            true
        )
    ]
}