import ch.so.agi.gretl.tasks.*
import ch.so.agi.gretl.api.TransferSet
import de.undercouch.gradle.tasks.download.Download

apply plugin: 'ch.so.agi.gretl'

defaultTasks 'transferData'

// ------------------------------------------------------------
// Directory Listing
// ------------------------------------------------------------

def xtfFolderPath = "${buildDir}/Downloads"
def unzipFolderPath = "${buildDir}/UnzipFolder"
// Link zu den historisierten Daten //
def baseUrl = 'https://files.geo.so.ch/ch.so.agi.av.mopublic/hist/2024-01-01/'

def directoryListing = new URL(baseUrl).text
def zipFiles = directoryListing.findAll(/href="([^"]+\.zip)"/) { match, fileName ->
    fileName}

def duckDbPath = "${buildDir}/temp.duckdb"
def duckDbUri = "jdbc:duckdb:${duckDbPath}"
def duckDbFile = file(duckDbPath)
// MOpublic-Modell für die historisierten Daten //
def model_hist = "SO_AGI_MOpublic_20190424"

println "Gefundene ZIP-Dateien: ${zipFiles.size()}"


/// ------------------------------------------------------------
// DuckDB Schemas einmalig erstellen
// ------------------------------------------------------------
tasks.register("createSchema_historisierte_objekte", Ili2duckdbImportSchema) {
    description = 'Schema für die historisierten Gebäude und Strassen'
    dbfile = duckDbFile
    models = "SO_AGI_Objekte_Historisch_Publikation_20260928"
    modeldir = file("$buildDir/ili").absolutePath +
               ";https://models.geo.admin.ch/"
    dbschema = "schema_objekte_historisch"
}

tasks.register("add_column",SqlExecutor){
    description = 'Zusätzliche Spalte um Geometriedaten als Text abspeichern zu können. Ist für den DB2DB-Task notwendig'
    dependsOn "createSchema_historisierte_objekte"
    database = [duckDbUri]
    sqlFiles = files(
        'duckdb_add_column.sql'
    )
}

tasks.register("createSchema_mopublic_hist", Ili2duckdbImportSchema) {
    description = 'Schema für die historisierten MOpublic-Daten'
    dependsOn "add_column"
    dbfile = duckDbFile
    models = model_hist
    modeldir = file("$buildDir/ili").absolutePath +
               ";https://models.geo.admin.ch/"
    dbschema = "schema_mopublic_2024"
}

// ------------------------------------------------------------
// Tasks pro Zip/XTF (Gemeinde)
// ------------------------------------------------------------
zipFiles.each { zipFileName ->
    // Dateiname ohne .zip
    def fileName = zipFileName.replaceFirst(/\.zip$/, '')
    // Eindeutiger Task-Name
    def taskSuffix = fileName.replaceAll('[^a-zA-Z0-9]', '_')
    // Dateien
    def zipFile = file("${xtfFolderPath}/${zipFileName}")
    def xtfFile = file("${unzipFolderPath}/${fileName}")

    // --------------------------------------------------------
    // Download Zip-Files
    // --------------------------------------------------------
    tasks.register("download_${taskSuffix}", Download) {
        description = "Download ${zipFileName}"
        src "${baseUrl}${zipFileName}"
        dest zipFile
        overwrite true
    }

    // --------------------------------------------------------
    // Zip-Files entpacken
    // --------------------------------------------------------
    tasks.register("unzip_${taskSuffix}", Copy) {
        description = "Unzip ${zipFileName}"
        dependsOn "download_${taskSuffix}"
        from zipTree(zipFile)
        into unzipFolderPath
    }

    // --------------------------------------------------------
    // DuckDB Import
    // --------------------------------------------------------
    tasks.register("import_${taskSuffix}", Ili2duckdbImport) {
        description = "Import ${fileName} into DuckDB"
        dependsOn "createSchema_mopublic_hist"
        dependsOn "unzip_${taskSuffix}"
        models = model_hist
        dbschema = "schema_mopublic_2024"
        dataFile = files(xtfFile)
        dbfile = duckDbFile
        skipGeometryErrors = true
        disableAreaValidation = true
        disableValidation = true
    }
}

// ------------------------------------------------------------
// Gesamter Import
// ------------------------------------------------------------
tasks.register('importXTF') {
    description = 'Import aller XTF in das historisierte Schema in DuckDB'
    dependsOn zipFiles.collect { zipFileName ->
        def fileName = zipFileName.replaceFirst(/\.zip$/, '')
        def taskSuffix = fileName.replaceAll('[^a-zA-Z0-9]', '_')
        "import_${taskSuffix}"
    }
}

tasks.register("copy_data",SqlExecutor){
    description = 'In DuckDB Daten aus dem historisierten Schema in das Zielschema kopieren'
    dependsOn "importXTF"
    database = [duckDbUri]
    sqlFiles = files(
        'load_extension_spatial.sql',
        'load_extension_postgres.sql',
        'agi_objekte_hist_bodenbedeckung.sql',
        'agi_objekte_hist_einzelobjekt.sql'
    )
}

tasks.register('transferData', Db2Db) {
    description = 'Daten aus DuckDB nach Postgis transferieren'
    dependsOn "copy_data"
    sourceDb = [duckDbUri]
    targetDb = [dbUriPub, dbUserPub, dbPwdPub]
    transferSets = [
        new TransferSet('agi_objekte_hist_bodenbedeckung_pub.sql', 'agi_objekte_historisch_pub_v1.objekte_bodenbedeckung', true, (String[])['geometrie:wkt:2056']),
        new TransferSet('agi_objekte_hist_einzelobjekt_pub.sql', 'agi_objekte_historisch_pub_v1.objekte_einzelobjekt_flaeche', true, (String[])['geometrie:wkt:2056'])
    ];
}