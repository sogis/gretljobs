import ch.so.agi.gretl.tasks.*
import ch.so.agi.gretl.api.TransferSet

apply plugin: 'ch.so.agi.gretl'

defaultTasks 'transferGrundwasser'

/**
 * Sammle alle Objekte aus der Erfassungsdatenbank und schreibe diese ins Publikationsmodell.
 */

task transferGrundwasser(type: Db2Db){
    description = "Baue die Daten vom Erfassungsmodell ins Publikationsmodell um"
    sourceDb = [dbUriEdit, dbUserEdit, dbPwdEdit]
    targetDb = [dbUriPub, dbUserPub, dbPwdPub]
    transferSets = [
        new TransferSet(
            'afu_stoffe_grundwasser_pub.sql',
            'afu_stoffe_grundwasser_pub_v1.feldprobe',
            true
        )
    ]
}