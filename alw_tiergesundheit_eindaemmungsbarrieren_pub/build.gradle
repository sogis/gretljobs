import ch.so.agi.gretl.tasks.*
import ch.so.agi.gretl.api.TransferSet
import java.nio.file.Paths
import java.io.File

apply plugin: 'ch.so.agi.gretl'

defaultTasks 'UpdateModInfoPub'

def xtfFile = file("$buildDir/alw_tiergesundheit_eindaemmung_v1.xtf")

task UpdateModInfo(type: SqlExecutor){
    description = 'Erstellt die Einträge in der Struktur ModInfo. Diese können beim Erfassen via Web GIS Client nicht miterfasst werden.'
    database = [dbUriEdit, dbUserEdit, dbPwdEdit]
    sqlFiles = files('update_alw_tiergesundheit_eindaemmungsbarrieren_modinfo.sql')
}

task exportXtf(type: Ili2pgExport){
    dependsOn UpdateModInfo
    database = [dbUriEdit, dbUserEdit, dbPwdEdit]
    models = "SO_ALW_Tiergesundheit_Eindaemmungsbarrieren_20261002"
    dbschema = "alw_tiergesundheit_eindaemmungsbarrieren_v2"
    dataFile = files(xtfFile)
    disableValidation = false
}

task validate(type: IliValidator) {
    dependsOn exportXtf
    description = "Validiert die exportierten INTERLIS-Datei gegen das Modell."
    dataFiles = files(xtfFile)
    if (findProperty('ilivalidatorModeldir')) modeldir = ilivalidatorModeldir
}

task deleteMassnahmen(type: SqlExecutor){
    dependsOn validate
    description = 'Löscht die Massnahmen in der Pub-DB'
    database = [dbUriPub, dbUserPub, dbPwdPub]
    sqlFiles = files('delete_alw_eindaemmungsbarrieren.sql')
}

task transferMassnahmen(type: Db2Db) {
    dependsOn deleteMassnahmen
    sourceDb = [dbUriEdit, dbUserEdit, dbPwdEdit]
    targetDb = [dbUriPub, dbUserPub, dbPwdPub]
    transferSets = [
            new TransferSet('alw_eindaemmungsbarrieren.sql', 'alw_tiergesundheit_eindaemmungsbarrieren_pub_v2.tiergesundheit_eindaemmungsbarrieren', false)
    ];
}

task UpdateModInfoPub(type: SqlExecutor){
    dependsOn transferMassnahmen
    description = 'Erstellt die Einträge in der Struktur ModInfo. Diese können beim Erfassen via Web GIS Client nicht miterfasst werden.'
    database = [dbUriPub, dbUserPub, dbPwdPub]
    sqlFiles = files('alw_eindaemmungsbarrieren_modinfo.sql')
}

