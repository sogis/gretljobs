import ch.so.agi.gretl.tasks.*
import ch.so.agi.gretl.api.TransferSet

apply plugin: 'ch.so.agi.gretl'

defaultTasks 'transferData'

tasks.register('validateData', Ili2pgValidate) {
    database = [dbUriEdit, dbUserEdit, dbPwdEdit]
    models = "SO_ARP_FFF_Kompensation_20260624"
    dbschema = "arp_fruchtfolgeflaechen_kompensation_v1"
}

tasks.register('transferData', Db2Db) {
    dependsOn "validateData"
    sourceDb = [dbUriEdit, dbUserEdit, dbPwdEdit]
    targetDb = [dbUriPub, dbUserPub, dbPwdPub]
    transferSets = [
            new TransferSet('arp_fruchtfolgeflaechen_kompensation_pub.sql', 'arp_fruchtfolgeflaechen_kompensation_pub_v1.kompensation_flaechen', true),
    ];
}