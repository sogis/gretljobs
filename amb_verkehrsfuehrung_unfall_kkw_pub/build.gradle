import ch.so.agi.gretl.tasks.*
import ch.so.agi.gretl.api.TransferSet

apply plugin: 'ch.so.agi.gretl'

defaultTasks 'transferverkehrsfuehrungPub'

task exportXtf(type: Ili2pgExport){
    database = [dbUriEdit, dbUserEdit, dbPwdEdit]
    models = "SO_AMB_Verkehrsfuehrung_Unfall_KKW_20261015"
    dbschema = "amb_verkehrsfuehrung_unfall_kkw_v1"
    dataFile = files(xtfFile)
    disableValidation = false
}

task validate(type: IliValidator) {
    dependsOn exportXtf
    description = "Validiert die exportierten INTERLIS-Datei gegen das Modell."
    dataFiles = files(xtfFile)
    if (findProperty('ilivalidatorModeldir')) modeldir = ilivalidatorModeldir
}

task transferverkehrsfuehrungPub(type: Db2Db) {
    dependsOn validate
    sourceDb = [dbUriEdit, dbUserEdit, dbPwdEdit]
    targetDb = [dbUriPub, dbUserPub, dbPwdPub]
    transferSets = [
            new TransferSet('amb_verkehrsfuehrung_unfall_kkw_freihaltung.sql', 'amb_verkehrsfuehrung_unfall_kkw_v1_pub.verkhrsf_nfll_kkw_vp_freihaltung_ra', true),
            new TransferSet('amb_verkehrsfuehrung_unfall_kkw_sperrstellen.sql', 'amb_verkehrsfuehrung_unfall_kkw_v1_pub.verkhrsf_nfll_kkw_sperrstellen', true),
            new TransferSet('amb_verkehrsfuehrung_unfall_kkw_hauptrettungsachse.sql', 'amb_verkehrsfuehrung_unfall_kkw_v1_pub.verkhrsf_nfll_kkw_hauptrettungsachse', true)
    ];
}
