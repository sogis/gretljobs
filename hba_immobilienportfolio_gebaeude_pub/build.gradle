import ch.so.agi.gretl.tasks.*
import ch.so.agi.gretl.api.TransferSet

apply plugin: 'ch.so.agi.gretl'

defaultTasks 'updateTxtValues', 'updateSearchIndex_1', 'updateSearchIndex_2', 'updateSearchIndex_3', 'updateSearchIndex_4', 'updateSearchIndex_5', 'updateSearchIndex_6', 'updateSearchIndex_7'

def csvFile = file("${buildDir}/in/uploadFile.csv")

tasks.register('deleteData', SqlExecutor) {
    description = 'Bisherige Daten löschen'
    database = [dbUriEdit, dbUserEdit, dbPwdEdit]
    sqlFiles = files("delete_csv.sql")
}

tasks.register('csvImport',  CsvImport) {
    description = 'Importiere CSV-Datei mit Gebäudedaten'
    dependsOn "deleteData"
    database = [dbUriEdit, dbUserEdit, dbPwdEdit]
    schemaName = "hba_immobilienportfolio_v2"
    tableName = "gebaeude_csv_import"
    firstLineIsHeader = true
    valueSeparator = ';'
    dataFile = csvFile
}

tasks.register("checkImportdata", SqlExecutor) {
    description = 'Umverteilung der Importdaten zur Prüfung derer Vollständigkeit'
    dependsOn "csvImport"
    database = [dbUriEdit, dbUserEdit, dbPwdEdit]
    sqlFiles = files(
        'hba_immobilienportfolio_gebeaude_mandatory_check.sql',
    )
}

tasks.register('transferData', Db2Db) {
    dependsOn "checkImportdata"
    sourceDb = [dbUriEdit, dbUserEdit, dbPwdEdit]
    targetDb = [dbUriPub, dbUserPub, dbPwdPub]
    transferSets = [
        new TransferSet('hba_immobilienportfolio_gebaeude_optional_pub.sql', 'hba_immobilienportfolio_pub_v2.immobilienprtflio_gebaeude', true),
        new TransferSet('hba_immobilienportfolio_gebaeude_mandatory_pub.sql', 'hba_immobilienportfolio_pub_v2.immobilienprtflio_gebaeude', false)
    ];
}

tasks.register("updateTxtValues", SqlExecutor) {
    description = 'Update der Text-Werte'
    dependsOn "transferData"
    database = [dbUriPub, dbUserPub, dbPwdPub]
    sqlFiles = files(
        'hba_immobilienportfolio_gebaeude_update.sql',
    )
}

// ---------------------------------------------------------------------------------
// Suchindexe Web GIS
// ---------------------------------------------------------------------------------

tasks.register('updateSearchIndex_1', SqlExecutor){
    mustRunAfter 'updateTxtValues'
    def layerName = 'ch.so.hba.immobilienportfolio.alle_immobilien_gebaeude'

    database = [dbUriPub, dbUserPub, dbPwdPub]
    def dbSearchSchema = dbSearchSchemaPub

    String layerNameString = "'${layerName}'"
    sqlParameters = [
            [layername: layerNameString, db_schema: dbSearchSchema]
    ]
    sqlFiles = files(
            '../searchindex_deleteFeatures.sql',
            'searchindex/' + 'searchindex_' + layerName + '.sql'
    )
    doFirst {
        println 'layer name: ' + layerName
    }
}

